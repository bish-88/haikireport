<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>売変レポート</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#14202b;--muted:#7b8794;--line:#e2e6ea;--accent:#17406d;--bad:#d03b3b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1418;--card:#171d22;--ink:#e9eef2;--muted:#8692a0;--line:#2a333b;--accent:#8db8ec;--bad:#ef7b7b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px 26px;width:100%;max-width:340px;display:grid;gap:14px}
h1{font-size:19px;margin:0}
p{margin:0;font-size:13px;color:var(--muted)}
input{font:inherit;font-size:22px;letter-spacing:.3em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:700;font-size:15px;padding:11px;border:0;border-radius:8px;background:var(--accent);color:var(--card);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
</style></head>
<body>
<form id="f" autocomplete="off">
  <h1>売変レポート</h1>
  <p>パスワードを入力してください。</p>
  <input id="pw" type="password" inputmode="numeric" autocomplete="current-password" aria-label="パスワード" required>
  <button id="go" type="submit">開く</button>
  <div class="err" id="err" role="alert"></div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  return new TextDecoder().decode(pt);
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const btn=document.getElementById("go"),err=document.getElementById("err");
  btn.disabled=true;btn.textContent="確認中…";err.textContent="";
  try{const html=await open_(document.getElementById("pw").value);
    try{sessionStorage.setItem("ur-pw",document.getElementById("pw").value)}catch(_){}
    document.open();document.write(html);document.close();}
  catch(_){err.textContent="パスワードが違います。";btn.disabled=false;btn.textContent="開く";document.getElementById("pw").select();}
});
try{const s=sessionStorage.getItem("ur-pw");if(s){document.getElementById("pw").value=s;document.getElementById("f").requestSubmit();}}catch(_){}
</script>
